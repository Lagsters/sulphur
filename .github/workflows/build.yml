# The "done" gate (tools/check.py) on the Linux Vircon32 tools, and the ROM as an artifact.
name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages and g++
        run: |
          python -m pip install numpy pillow
          sudo apt-get update
          sudo apt-get install -y g++ libsdl2-2.0-0 libpng16-16t64

      # dev tools (.deb), the console source and the runner built from it; keyed by the pins
      - uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/toolchain.py', 'tools/runner/runner.cpp') }}

      - name: Gate
        run: python tools/check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sulphur-rom
          path: build/sulphur.v32
          if-no-files-found: warn
